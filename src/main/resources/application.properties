spring.application.name=commerce-ai-assistant
server.port=18080

## Anthropic Configuration - Chat Client
spring.ai.model.chat=anthropic
spring.ai.anthropic.base-url=${ANTHROPIC_BASE_URL}
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.model=${ANTHROPIC_CHAT_MODEL}

## Ollama Configuration - Local Embeddings
spring.ai.model.embedding=ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.model=nomic-embed-text

## Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

## Redis Vector Store (Redis Stack/Redis Query) Configuration
spring.ai.vectorstore.redis.initialize-schema=true
spring.ai.vectorstore.redis.index-name=commerce-ai-index
spring.ai.vectorstore.redis.prefix=commerce-ai: